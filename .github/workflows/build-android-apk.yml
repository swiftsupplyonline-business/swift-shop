name: Build Android APK

on:
  push:
    branches: [ go-live-android-apk-build ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Android variant to build"
        required: true
        default: "productionDebug"
        type: choice
        options:
          - productionDebug
          - stagingDebug
          - devDebug

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ inputs.variant }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew :app:assemble${{ inputs.variant }}

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was produced."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Produced: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swift-${{ inputs.variant }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
