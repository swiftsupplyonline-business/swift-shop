name: Build Swift Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - canonical-reconcile-d
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'app/**'
      - 'core/**'
      - 'data/**'
      - 'domain/**'
      - 'feature/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

concurrency:
  group: swift-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify installable Dev APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/dev/debug/app-dev-debug.apk
          sha256sum app/build/outputs/apk/dev/debug/app-dev-debug.apk
          ls -lh app/build/outputs/apk/dev/debug/app-dev-debug.apk

      - name: Upload installable Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: swift-android-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
