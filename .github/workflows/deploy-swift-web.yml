name: Deploy Swift Web Interface
on:
  workflow_dispatch:
concurrency:
  group: swift-web-interface-production
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy Firebase Hosting only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWIFT_D1BAA }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Swift Hosting only
        run: firebase deploy --only hosting --project swift-d1baa --non-interactive
      - name: Deployment summary
        run: |
          echo "### Swift Web Interface deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: `swift-d1baa`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: `${GITHUB_REF_NAME}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hosting: https://swift-d1baa.web.app" >> "$GITHUB_STEP_SUMMARY
