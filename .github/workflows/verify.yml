name: Verify Swift Shop

on:
  push:
    branches: [ master, delivery-first-checkout, go-live-brick0-7-remediation ]
  pull_request:
    branches: [ master, delivery-first-checkout ]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Run Unit Tests
        run: ./gradlew testDebugUnitTest

  functions-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Typecheck and Build
        run: npm run build
        working-directory: functions

  functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build functions before emulator tests
        run: npm run build
        working-directory: functions

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Run Tests with Emulator
        run: firebase emulators:exec --project demo-swift-shop-reconciled "npm --prefix functions test"
