name: Verify Swift Shop

on:
  push:
    branches: [ master, delivery-first-checkout, canonical-reconcile-d, canonical-platform-integration-2026-09-29, canonical-platform-tree-2026-09-29 ]
  pull_request:
    branches: [ master, delivery-first-checkout, canonical-platform-integration-2026-09-29, canonical-platform-tree-2026-09-29 ]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Run Unit Tests
        run: ./gradlew testDebugUnitTest

  functions-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm --prefix functions install

      - name: Typecheck and Build
        run: npm --prefix functions run build

  functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm --prefix functions install

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Run Tests with Emulator
        run: firebase emulators:exec --project swift-shop-reconciled "npm --prefix functions test"

  canonical-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict canonical architecture audit
        run: bash scripts/canonical-audit.sh

  web-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install acorn (ES module parser)
        run: npm install -g acorn

      - name: P6 — JavaScript syntax check (ES2022 module)
        run: |
          acorn --ecma2022 --module hosting/app.js > /dev/null
          echo "✅ hosting/app.js syntax OK"

      - name: P7 — Structural integrity check (no duplicate declarations)
        run: |
          node - << 'JS'
          const fs = require('fs');
          const src = fs.readFileSync('hosting/app.js', 'utf8');

          const singletons = [
            'initializeApp',
            'firebaseConfig',
            'renderBrowse',
            'renderShop',
            'renderListing',
            'renderCart',
            'renderCheckout',
            'renderSearch',
            'renderOrders',
            'renderOrderDetail',
            'function navigate',
            'function route',
          ];

          let failed = false;
          for (const symbol of singletons) {
            // Count function/const definitions only (not calls)
            const pattern = new RegExp(
              symbol.startsWith('function ')
                ? `\\b${symbol}\\b`
                : `(^|\\n)(const|let|var|function|async function)\\s+${symbol}\\b`,
              'g'
            );
            const hits = (src.match(pattern) || []).length;
            if (hits > 1) {
              console.error(`❌ DUPLICATE: "${symbol}" declared ${hits} times`);
              failed = true;
            } else {
              console.log(`✅ ${symbol}: ${hits} declaration(s)`);
            }
          }

          // Exactly one export
          const exportHits = (src.match(/^export \{/gm) || []).length;
          if (exportHits !== 1) {
            console.error(`❌ export { } appears ${exportHits} times (expected 1)`);
            failed = true;
          } else {
            console.log(`✅ export { }: 1`);
          }

          // No literal \n corruption
          if (src.includes('\\\\n')) {
            console.error('❌ Literal \\\\n source corruption detected');
            failed = true;
          } else {
            console.log('✅ No literal \\\\n corruption');
          }

          // No duplicate application boundary marker
          if (src.includes('}/ SwiftShop')) {
            console.error('❌ Duplicate application boundary marker found');
            failed = true;
          } else {
            console.log('✅ No duplicate application boundary');
          }

          if (failed) process.exit(1);
          console.log('\n✅ hosting/app.js structural integrity: PASS');
          JS
