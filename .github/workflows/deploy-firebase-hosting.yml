name: Deploy Swift Dev Web

on:
  push:
    branches:
      - delivery-first-checkout
  workflow_dispatch:

concurrency:
  group: firebase-hosting-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Swift Dev Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWIFT_DEV_3D3AE }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Build Firebase Functions
        working-directory: functions
        run: npm run build

      - name: Deploy Swift Dev Hosting and Marketplace API
        run: firebase deploy --only hosting,functions:publicMarketplace,functions:payPreview --project swift-dev-3d3ae --non-interactive

      - name: Deployment summary
        run: |
          echo "### Swift Firebase Hosting deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: `swift-dev-3d3ae`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: `${GITHUB_REF_NAME}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hosting: https://swift-dev-3d3ae.web.app" >> "$GITHUB_STEP_SUMMARY"
