<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwiftShop — Buy and sell in Maseru</title>
  <meta name="description" content="Discover real shops and listings on SwiftShop.">
  <style>
    :root { --blue: #1b6ef3; --bg: #fafafa; --text: #1a1a1a; --muted: #666; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; background: white; border-bottom: 1px solid #eee; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
    header a.logo { font-weight: 700; font-size: 18px; color: var(--blue); text-decoration: none; }
    header .cart-link { position: relative; text-decoration: none; color: var(--text); font-weight: 600; }
    [data-cart-badge] { display: none; position: absolute; top: -8px; right: -14px; background: var(--blue); color: white; font-size: 11px; padding: 1px 6px; border-radius: 10px; }
    .hero-banner { width: 100%; margin: 0 auto 24px; overflow: hidden; background: #fff; }
    .hero-banner img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: cover; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 24px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { display: block; background: white; border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #eee; }
    .card-img { height: 130px; background-size: cover; background-position: center; background-color: #eee; }
    .card-body { padding: 8px 10px; }
    .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-price { font-size: 13px; color: var(--blue); font-weight: 700; margin-top: 2px; }
    .shop-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
    .shop-card { flex: 0 0 auto; text-align: center; text-decoration: none; color: inherit; width: 72px; }
    .shop-logo { width: 60px; height: 60px; border-radius: 50%; background-size: cover; background-position: center; background-color: #eee; margin: 0 auto 4px; }
    .shop-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shop-header { margin-bottom: 20px; }
    .shop-cover { height: 140px; border-radius: 12px; background-size: cover; background-position: center; background-color: #eee; margin-bottom: 12px; }
    .listing-detail .listing-img { height: 280px; border-radius: 12px; background-size: cover; background-position: center; background-color: #eee; margin-bottom: 12px; }
    .listing-detail .price { font-size: 20px; font-weight: 700; color: var(--blue); margin: 4px 0 12px; }
    .listing-detail .shop-link { color: var(--blue); text-decoration: none; font-size: 14px; }
    .listing-detail .actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn { flex: 1; padding: 14px; border-radius: 10px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; }
    .btn.primary { background: var(--blue); color: white; }
    .btn.secondary { background: #eee; color: var(--text); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cart-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
    .cart-title { flex: 1; }
    .qty-input { width: 56px; padding: 6px; }
    .remove-btn { background: none; border: none; color: #c00; cursor: pointer; }
    .summary { background: white; border: 1px solid #eee; border-radius: 12px; padding: 14px; margin: 16px 0; }
    .summary .total { font-weight: 700; margin-top: 6px; border-top: 1px solid #eee; padding-top: 6px; }
    .payment-methods { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .payment-methods label.disabled { color: var(--muted); }
    .loading, .empty, .error, .success { padding: 40px 0; text-align: center; color: var(--muted); }
    .error { color: #c00; }
    #checkoutMsg { margin-top: 10px; text-align: center; color: var(--muted); }
    @media (max-width: 700px) { .hero-banner { margin-bottom: 16px; } .hero-banner img { min-height: 260px; object-fit: cover; object-position: center; } }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">SwiftShop</a>
    <a class="cart-link" href="/cart">Cart <span data-cart-badge></span></a>
  </header>
  <section class="hero-banner" aria-label="Swift shopping and delivery">
    <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JcBFKioSjjhMWhdbh2ILNIqklk/1b89a04f-d556-4b4f-9812-ab95681f8b2e.jpg" alt="Swift — Buy and get delivered. Your favourite shops, local sellers and fast delivery, all on Swift." loading="eager" fetchpriority="high" width="1280" height="640">
  </section>
  <main id="app"><div class="loading">Loading…</div></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
