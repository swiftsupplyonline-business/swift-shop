<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SwiftShop — Buy and sell in Maseru</title>
<meta name="description" content="Discover real shops and listings on SwiftShop.">
<link rel="icon" href="https://raw.githubusercontent.com/swiftsupplyonline-business/swift-shop/master/app/src/main/res/drawable/swift_icon_flat.png">
<style>
:root{--ink:#111318;--muted:#747983;--line:#e8e9ec;--paper:#f7f7f5;--card:#fff;--shadow:0 18px 60px rgba(17,19,24,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.84);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.05)}
.nav{height:72px;max-width:1180px;margin:auto;padding:0 22px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:-.04em}.brand img{width:34px;height:34px;object-fit:contain}.search{flex:1;max-width:480px;margin:auto;position:relative}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 18px 13px 44px;outline:none}.search span{position:absolute;left:16px;top:11px;font-size:18px}.nav-actions{display:flex;gap:9px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;position:relative;display:inline-flex;align-items:center;gap:6px}
[data-cart-badge]{display:none;background:#111;color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:11px;padding:0 5px;align-items:center;justify-content:center}

main{max-width:1180px;margin:auto;padding:26px 22px 100px}
.hero{min-height:390px;border-radius:34px;overflow:hidden;position:relative;background:radial-gradient(circle at 78% 32%,#fff 0,#ecebe6 26%,#d7d5cf 55%,#bbb9b2 100%);display:grid;grid-template-columns:1.05fr .95fr;align-items:center;padding:48px}
.hero:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:80px;top:10px;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(0,0,0,.12));box-shadow:inset -35px -35px 80px rgba(0,0,0,.12),0 35px 80px rgba(0,0,0,.16);transform:rotate(-14deg);animation:float 6s ease-in-out infinite}
.hero:after{content:"SWIFT";position:absolute;right:62px;bottom:24px;font-size:110px;font-weight:1000;letter-spacing:-.09em;color:rgba(255,255,255,.35);transform:rotate(-8deg)}
.hero-copy{position:relative;z-index:2;max-width:570px}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.18em;font-weight:800;color:#606269}.hero h1{font-size:clamp(42px,6vw,78px);line-height:.9;letter-spacing:-.075em;margin:14px 0 22px}.hero p{font-size:18px;line-height:1.55;color:#4e5158;max-width:510px}
.cta{background:#111;color:#fff;border-radius:999px;padding:14px 20px;font-weight:800;margin-top:12px;box-shadow:0 12px 30px rgba(0,0,0,.16);transition:.25s;display:inline-block}.cta:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(0,0,0,.22)}

.section{margin-top:46px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section h2{font-size:29px;letter-spacing:-.05em;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:5px}

.categories{display:flex;gap:12px;overflow:auto;padding:2px 0 8px}.cat{min-width:120px;height:96px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;transition:.25s}.cat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.cat b{font-size:25px}.cat span{font-weight:750;font-size:13px}.cat.active{background:#111;color:#fff;border-color:#111}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.product{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;transition:.28s}.product:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.photo{height:220px;position:relative;overflow:hidden;background:#ecebe7;background-size:cover;background-position:center}
.tag{position:absolute;left:12px;top:12px;background:#fff;border-radius:99px;padding:6px 9px;font-size:10px;font-weight:900}
.heart{position:absolute;right:11px;top:11px;background:rgba(255,255,255,.88);border-radius:50%;width:34px;height:34px;border:0}
.info{padding:15px}.p-shop{font-size:11px;color:#888;font-weight:700}.p-name{font-weight:850;margin:5px 0}.p-price{font-weight:900;font-size:18px}

.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.shop-card{background:#111;color:#fff;border-radius:26px;padding:22px;min-height:190px;position:relative;overflow:hidden;display:block}
.shop-card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-45px;top:-40px;background:radial-gradient(circle,#777,#222 70%);opacity:.8}
.shop-card h3{font-size:24px;letter-spacing:-.05em;margin:35px 0 6px;position:relative;z-index:2}.shop-card p{color:#aaa;position:relative;z-index:2;font-size:13px}
.shop-avatar{position:absolute;left:20px;top:20px;width:42px;height:42px;border-radius:15px;background-size:cover;background-position:center;background-color:#fff;z-index:3}

.detail{display:grid;grid-template-columns:1fr 1fr;gap:30px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:30px}
.detail-photo{min-height:400px;border-radius:22px;background:#e8e7e3;background-size:cover;background-position:center}
.detail h1{font-size:38px;letter-spacing:-.05em;line-height:.98;margin:0 0 8px}
.detail .price{font-size:28px;font-weight:900;margin:14px 0}
.detail .stock{color:var(--muted);font-size:13px;margin:10px 0}
.detail .shop-link{display:inline-block;margin:6px 0 18px;color:#555;font-weight:700;text-decoration:underline}
.actions{display:flex;gap:12px;margin-top:14px}

.btn{border-radius:999px;padding:14px 20px;font-weight:800}
.btn.primary{background:#111;color:#fff}.btn.secondary{background:#eee;color:#111}.btn:disabled{opacity:.5;cursor:not-allowed}

.cart-list{margin:20px 0}
.cart-row{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.cart-title{flex:1;font-weight:700}.qty-input{width:56px;border:1px solid var(--line);border-radius:10px;padding:8px}
.remove-btn{background:none;color:#c00;font-weight:700}

.summary{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:18px 0}
.summary .row{display:flex;justify-content:space-between;margin:8px 0}.summary .total{font-weight:900;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.payment-methods{display:flex;flex-direction:column;gap:10px;margin:16px 0}.payment-methods label.disabled{color:var(--muted)}
#checkoutMsg{margin-top:12px;color:var(--muted)}

.loading,.empty,.error,.success{padding:60px 0;text-align:center;color:var(--muted)}.error{color:#c00}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 17px;border-radius:999px;opacity:0;pointer-events:none;z-index:100;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes float{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-10deg) translateY(-14px)}}
@media(max-width:850px){.nav{gap:10px}.search{order:3;flex-basis:100%;max-width:none}.nav{height:auto;min-height:72px;flex-wrap:wrap;padding-bottom:10px}.hero{grid-template-columns:1fr;min-height:480px;padding:32px}.hero:before{right:-60px;bottom:-90px;top:auto}.hero:after{font-size:70px;right:18px}.grid{grid-template-columns:repeat(2,1fr)}.shops{grid-template-columns:1fr}.photo{height:180px}.detail{grid-template-columns:1fr;padding:20px}.detail-photo{min-height:280px}}
@media(max-width:500px){main{padding:16px 14px 90px}.hero{border-radius:25px;padding:25px}.hero h1{font-size:44px}.grid{gap:10px}.product{border-radius:18px}.photo{height:155px}.info{padding:12px}.nav-actions .pill.fav{display:none}}
</style>
</head>
<body>
<header class="top"><nav class="nav">
<a class="brand" href="/"><img src="https://raw.githubusercontent.com/swiftsupplyonline-business/swift-shop/master/app/src/main/res/drawable/swift_icon_flat.png">Swift</a>
<div class="search"><span>⌕</span><input id="search" placeholder="Search products, shops..."></div>
<div class="nav-actions"><button class="pill fav">♡</button><a class="pill" href="/cart">Bag <i data-cart-badge></i></a></div>
</nav></header>
<main id="app"><div class="loading">Loading…</div></main>
<div class="toast" id="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
