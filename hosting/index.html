<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swift — Buy from local shops</title>
<meta name="description" content="Swift connects customers with local shops and products across Lesotho.">
<link rel="icon" href="https://raw.githubusercontent.com/swiftsupplyonline-business/swift-shop/master/app/src/main/res/drawable/swift_icon_flat.png">
<style>
:root{--ink:#111318;--muted:#747983;--line:#e8e9ec;--paper:#f7f7f5;--card:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.06)}.nav{min-height:72px;max-width:1180px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px;letter-spacing:-.04em}.brand img{width:34px;height:34px;object-fit:contain}.search{flex:1;max-width:520px;margin:auto}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 18px;outline:none}.nav-actions{display:flex;gap:9px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px}
main{max-width:1180px;margin:auto;padding:26px 22px 100px}.hero{position:relative;overflow:hidden;border-radius:30px;min-height:430px;padding:48px;background:linear-gradient(110deg,#fff 0%,#f2f1ed 52%,#ddd9d0 100%);margin-bottom:42px;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,46%);align-items:center;gap:24px}.hero-copy{position:relative;z-index:2;max-width:650px}.hero-media{height:100%;min-height:330px;display:flex;align-items:center;justify-content:flex-end}.hero-media img{width:100%;height:100%;max-height:410px;object-fit:cover;border-radius:24px;box-shadow:0 18px 50px rgba(17,19,24,.16);display:block}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.16em;font-weight:800;color:#686b72}.hero h1{font-size:clamp(42px,6vw,76px);line-height:.92;letter-spacing:-.07em;margin:14px 0 20px;max-width:700px}.hero p{font-size:18px;line-height:1.55;color:#4e5158;max-width:600px}.hero-cta{display:inline-block;margin-top:22px}
#app{min-height:240px}.loading,.empty,.error{padding:32px 0;color:var(--muted)}.error{color:#a22}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 50px rgba(17,19,24,.09)}.card-img{height:220px;background:#e9e8e4 center/cover no-repeat}.card-body{padding:15px}.card-title{font-weight:850;margin-bottom:7px}.card-price{font-weight:900;font-size:18px}.shop-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px}.shop-card{position:relative;overflow:hidden;background:#111;color:#fff;border-radius:22px;min-height:190px;padding:20px;display:block}.shop-card-cover{position:absolute;inset:0;z-index:0;background:#111 center/cover no-repeat}.shop-card-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.72) 100%)}.shop-card-content{position:relative;z-index:2;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.shop-logo{width:52px;height:52px;border-radius:15px;background:#fff center/cover no-repeat;box-shadow:0 4px 18px rgba(0,0,0,.18)}.shop-name{font-size:23px;font-weight:850;letter-spacing:-.04em;text-shadow:0 1px 8px rgba(0,0,0,.3)}.shop-header{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:22px}.shop-cover{height:180px;border-radius:18px;background:#eee center/cover no-repeat;margin-bottom:20px}.shop-header h1{margin:0 0 8px}.listing-detail{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}.listing-img{height:420px;border-radius:18px;background:#eee center/cover no-repeat;margin-bottom:24px}.listing-detail h1{font-size:40px;letter-spacing:-.05em;margin:0 0 8px}.price{font-size:28px;font-weight:900;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer}.btn.primary{background:#111;color:#fff}.btn.secondary{background:#eee;color:#111}.cart-list{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.cart-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cart-row:last-child{border-bottom:0}.cart-title{flex:1;font-weight:750}.qty-input{width:70px;padding:8px;border:1px solid var(--line);border-radius:9px}.summary{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;max-width:600px}.total{font-size:22px;font-weight:900;margin-top:12px}.payment-methods{display:grid;gap:10px;margin:20px 0}.success{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}
@media(max-width:850px){.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.grid{grid-template-columns:repeat(2,1fr)}.shop-row{grid-template-columns:1fr}.hero{padding:32px;grid-template-columns:1fr}.hero-media{min-height:240px}.hero-media img{max-height:280px}.listing-img{height:300px}}@media(max-width:500px){main{padding:16px 14px 80px}.grid{gap:10px}.card-img{height:170px}.hero{border-radius:24px;padding:26px}.hero h1{font-size:48px}.hero-media{min-height:190px}.hero-media img{max-height:220px;border-radius:18px}.nav-actions .pill:first-child{display:none}}
</style>
</head>
<body>
<header class="top"><nav class="nav">
<a class="brand" href="/"><img src="https://raw.githubusercontent.com/swiftsupplyonline-business/swift-shop/master/app/src/main/res/drawable/swift_icon_flat.png" alt="Swift">Swift</a>
<div class="search"><input id="search" placeholder="Search products, shops..." aria-label="Search products and shops"></div>
<div class="nav-actions"><a class="pill" href="/cart">Bag <span data-cart-badge></span></a></div>
</nav></header>
<main>
<section class="hero"><div class="hero-copy"><div class="eyebrow">Swift marketplace · Lesotho</div><h1>Local Market,<br>Delivered Fast</h1><p>Find products from local businesses, buy now, and have them delivered to you instantly.</p><a class="btn primary hero-cta" href="/market">Shop the Market</a></div><div class="hero-media"><img src="/img/swift-maseru-hero.jfif" alt="Swift marketplace in Maseru, Lesotho"></div></section>
<div id="app" aria-live="polite"></div>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
