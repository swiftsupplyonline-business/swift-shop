<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swift — Buy from local shops</title>
<meta name="description" content="Swift connects customers with local shops and products across Lesotho.">
<link rel="icon" href="https://raw.githubusercontent.com/swiftsupplyonline-business/swift-shop/master/app/src/main/res/drawable/swift_icon_flat.png">
<style>
:root{--ink:#111318;--muted:#747983;--line:#e8e9ec;--paper:#f7f7f5;--card:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.06)}.nav{min-height:72px;max-width:1180px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px;letter-spacing:-.04em}.brand img{width:34px;height:34px;object-fit:contain}.search{flex:1;max-width:520px;margin:auto}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 18px;outline:none}.nav-actions{display:flex;gap:9px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px}
main{max-width:1180px;margin:auto;padding:26px 22px 100px}
.rail{position:fixed;left:18px;top:92px;width:170px;z-index:10;display:grid;gap:7px}
.rail a{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);font-weight:800;box-shadow:0 8px 28px rgba(17,19,24,.05)}
.rail a:hover,.rail a:focus-visible{background:#111;color:#fff}
.rail .rail-label{font-size:13px}
.rail-spacer{height:0}
.rail-page{max-width:900px;margin:auto}
.search-panel{display:flex;gap:10px;margin:18px 0 28px}
.search-panel input{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;outline:none}
.search-group{margin-bottom:38px}
.orders-list{display:grid;gap:12px}
.order-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
.order-card:hover{box-shadow:0 12px 35px rgba(17,19,24,.08);transform:translateY(-1px)}
.order-card-top,.order-card-bottom,.order-line{display:flex;justify-content:space-between;gap:16px;align-items:center}
.order-card-top span{color:var(--muted);font-size:12px}
.order-items{color:#4f535b}
.status-pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eef0f3;font-size:12px;font-weight:800}
.order-detail-grid{display:grid;gap:16px}
.order-panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.order-panel h2{margin-top:0}
.order-line{padding:11px 0;border-bottom:1px solid var(--line)}
.order-line:last-child{border-bottom:0}
.total-line{font-size:18px;padding-top:16px}
.back-link{display:inline-block;margin-bottom:18px;font-weight:800}
.hero{position:relative;overflow:hidden;border-radius:30px;min-height:430px;padding:48px;background:#111;margin-bottom:42px;display:flex;align-items:center}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.76) 0%,rgba(0,0,0,.48) 48%,rgba(0,0,0,.18) 100%);z-index:1}.hero-copy{position:relative;z-index:3;max-width:650px;color:#fff}.hero-media{position:absolute;inset:0;z-index:0}.hero-media img{width:100%;height:100%;object-fit:cover;display:block}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.16em;font-weight:800;color:#686b72}.hero .eyebrow{color:rgba(255,255,255,.82)}.hero h1{font-size:clamp(42px,6vw,76px);line-height:.92;letter-spacing:-.07em;margin:14px 0 20px;max-width:700px}.hero p{font-size:18px;line-height:1.55;color:rgba(255,255,255,.9);max-width:600px}.hero-cta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;background:#fff;color:#111318;padding:15px 22px;border-radius:16px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.hero-cta::after{content:"→";font-size:20px;line-height:1;transition:transform .18s ease}.hero-cta:hover{background:#f4f4f2;transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.34)}.hero-cta:hover::after{transform:translateX(3px)}.hero-cta:focus-visible{outline:3px solid rgba(255,255,255,.8);outline-offset:4px}
#app{min-height:240px}.loading,.empty,.error{padding:32px 0;color:var(--muted)}.error{color:#a22}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 50px rgba(17,19,24,.09)}.card-img{height:220px;background:#e9e8e4 center/cover no-repeat}.card-body{padding:15px}.card-title{font-weight:850;margin-bottom:7px}.card-price{font-weight:900;font-size:18px}.shop-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px}.shop-card{position:relative;overflow:hidden;background:#111;color:#fff;border-radius:22px;min-height:190px;padding:20px;display:block}.shop-card-cover{position:absolute;inset:0;z-index:0;background:#111 center/cover no-repeat}.shop-card-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.72) 100%)}.shop-card-content{position:relative;z-index:2;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.shop-logo{width:52px;height:52px;border-radius:15px;background:#fff center/cover no-repeat;box-shadow:0 4px 18px rgba(0,0,0,.18)}.shop-name{font-size:23px;font-weight:850;letter-spacing:-.04em;text-shadow:0 1px 8px rgba(0,0,0,.3)}.shop-header{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:22px}.shop-cover{height:180px;border-radius:18px;background:#eee center/cover no-repeat;margin-bottom:20px}.shop-header h1{margin:0 0 8px}.listing-detail{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}.listing-img{height:420px;border-radius:18px;background:#eee center/cover no-repeat;margin-bottom:24px}.listing-detail h1{font-size:40px;letter-spacing:-.05em;margin:0 0 8px}.price{font-size:28px;font-weight:900;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer}.btn.primary{background:#111;color:#fff}.btn.secondary{background:#eee;color:#111}.cart-list{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.cart-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cart-row:last-child{border-bottom:0}.cart-title{flex:1;font-weight:750}.qty-input{width:70px;padding:8px;border:1px solid var(--line);border-radius:9px}.summary{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;max-width:600px}.total{font-size:22px;font-weight:900;margin-top:12px}.payment-methods{display:grid;gap:10px;margin:20px 0}.success{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}
.market-front-door{display:grid;gap:16px;margin-bottom:42px}
.ad-slot{min-height:92px;border:1px solid var(--line);border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 22px;color:var(--muted);text-align:center}
.ad-slot strong{color:var(--ink);font-size:14px}
.ad-slot small{font-size:12px}
.ad-label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;opacity:.7}
.swift-house-ad{position:relative;overflow:hidden;min-height:180px;border-radius:24px;padding:28px;background:linear-gradient(110deg,#111318 0%,#30343b 58%,#555a61 100%);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.swift-house-copy{max-width:680px;min-height:105px;display:flex;flex-direction:column;justify-content:flex-end}
.swift-house-copy .ad-label{margin-bottom:12px;color:rgba(255,255,255,.72)}
.swift-house-slide{display:none}
.swift-house-slide.is-active{display:flex;flex-direction:column;gap:7px;animation:swiftFade .35s ease}
.swift-house-slide strong{font-size:clamp(24px,4vw,38px);line-height:1;letter-spacing:-.055em}
.swift-house-slide span{font-size:15px;line-height:1.45;color:rgba(255,255,255,.82);max-width:560px}
.swift-house-dots{display:flex;gap:6px;padding-bottom:3px}
.swift-house-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.32)}
.swift-house-dots span.is-active{background:#fff}
.guest-entry{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px 24px}
.guest-entry h2{margin:5px 0 5px;font-size:28px;letter-spacing:-.045em}
.guest-entry p{margin:0;color:var(--muted)}
.guest-btn{font-size:15px;padding:15px 20px;white-space:nowrap}
.guest-btn span{margin-left:7px}
.guest-btn:disabled{opacity:.65;cursor:wait}
.signin-note{grid-column:1 / -1;color:var(--muted);font-size:13px;padding-top:4px;border-top:1px solid var(--line)}
.text-btn{border:0;background:none;padding:0;color:var(--ink);font-weight:800;cursor:pointer}
.market-ready{grid-column:1 / -1;color:#5e646d;font-size:12px}
.error-text{color:#a22}
.section-heading{margin-bottom:14px}
.section-heading h2{margin:5px 0 0;font-size:30px;letter-spacing:-.05em}
.market-feed{margin-bottom:40px}
@keyframes swiftFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:1201px){main{margin-left:210px;max-width:calc(100% - 250px);margin-right:22px}}
@media(max-width:1200px){.rail{position:static;width:auto;display:flex;max-width:1180px;margin:0 auto;padding:8px 22px;background:var(--paper);box-shadow:none;overflow-x:auto}.rail a{white-space:nowrap}.rail-spacer{display:none}}
@media(max-width:850px){.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.grid{grid-template-columns:repeat(2,1fr)}.shop-row{grid-template-columns:1fr}.hero{padding:32px;min-height:400px}.listing-img{height:300px}.guest-entry{grid-template-columns:1fr}.guest-btn{justify-self:start}.swift-house-ad{min-height:170px}}
@media(max-width:500px){main{padding:16px 14px 80px}.grid{gap:10px}.card-img{height:170px}.hero{border-radius:24px;padding:26px}.hero h1{font-size:48px}.hero{min-height:390px;border-radius:24px;padding:26px}.nav-actions .pill:first-child{display:none}.ad-slot{min-height:76px;flex-wrap:wrap;gap:5px 9px}.ad-slot small{flex-basis:100%}.swift-house-ad{padding:22px;min-height:190px}.swift-house-dots{position:absolute;right:22px;bottom:22px}.guest-entry{padding:22px}.guest-entry h2{font-size:25px}}

.market-front-door{gap:14px;margin-bottom:38px}.ad-slot{border-color:#dcebf2;background:rgba(255,255,255,.82);box-shadow:0 8px 25px rgba(16,40,58,.045)}.swift-house-ad{background:linear-gradient(115deg,#0c2536 0%,#14577c 55%,#35a7d7 100%);box-shadow:var(--shadow)}.guest-entry{border-color:#dcebf2;box-shadow:var(--shadow);background:rgba(255,255,255,.94)}.guest-btn,.btn.primary{background:linear-gradient(135deg,#1c92ca,#0875aa);box-shadow:0 9px 24px rgba(8,117,170,.2)}.guest-btn:hover,.btn.primary:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn.secondary{background:#eaf7fc;color:#15506d;border:1px solid #d5eaf4}

<body>
<header class="top"><nav class="nav">
